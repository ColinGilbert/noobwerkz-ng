[workspace]
members = ["crates/shared", "crates/client", "crates/server", "crates/skeletal-animation", "crates/gltf2-converter"]
resolver = "3"

[workspace.dependencies]
glam = { version = "0.33.12", features=["bytemuck"]}
rapier3d = { version = "0.35", features = ["serde-serialize", "enhanced-determinism"] }
web-time = "1.1.0"
safe_index = "0.10.0"
netcode-rs = "1.4.0"
zero_ecs = "0.3.4"
bevy_ballistic_stripped = { git = "https://github.com/colingilbert/bevy_ballistic.git", branch = "main" }
once_cell = "1.21.4"
msgpacker = "0.7.2"
rayon = "1.12.0"
anyhow = "1.0.104"
petgraph = "0.8.3"