[workspace]
members = ["crates/shared", "crates/client", "crates/server", "crates/skeletal-animation", "crates/gltf2-converter", "crates/example", "crates/assimp-converter", "crates/code-transforms", "crates/proto", "crates/terrain-erosion"]
resolver = "3"

[workspace.dependencies]
glam = { version = "0.33.12", features = ["bytemuck"]}
rapier3d = { version = "0.36.1", features = ["serde-serialize", "enhanced-determinism"] }
web-time = "1.1.0"
safe_index = "0.10.0"
netcode-rs = "1.4.0"
zero_ecs = "0.3.4"
once_cell = "1.21.4"
rayon = "1.12.0"
anyhow = "1.0.104"
petgraph = "0.8.3"
clap = { version = "4.6.9", features = ["derive"] }
polyanya = { version = "0.18.0", features = ["detailed-layers"]}
rerecast = { version = "0.5.1" }
monstertruck = { version = "0.4.2", features = ["solid"]}
serde_json = {version = "1.0.154"}
serde = {version = "1.0.229" }
binary-greedy-meshing = "0.6.4"
quick-noise = "0.3.0"
prost = "0.14.6"
prost-types = "0.14.6"
prost-build = "0.14.6"
image = "0.25.10"
num_cpus = "1.17.0"
rand = "0.10.4"
wasmtime = { version = "51.0", default-features = false, features = ["runtime"]}
#landmark = { git = "https://www.github.com/ColinGilbert/recast-rs.git", branch = "main" }
#waymark = { git = "https://www.github.com/ColinGilbert/recast-rs.git", branch = "main" }
#waymark-crowd = { git = "https://www.github.com/ColinGilbert/recast-rs.git", branch = "main" }
#waymark-dynamic = { git = "https://www.github.com/ColinGilbert/recast-rs.git", branch = "main" }
#waymark-tilecache = { git = "https://www.github.com/ColinGilbert/recast-rs.git", branch = "main" }