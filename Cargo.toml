[workspace]
members = ["crates/shared", "crates/client", "crates/server", "crates/skeletal-animation", "crates/gltf2-converter", "crates/example", "crates/assimp-converter", "crates/code-transforms"]
resolver = "3"

[workspace.dependencies]
glam = { version = "0.33.12", features = ["bytemuck"]}
rapier3d = { version = "0.36", features = ["serde-serialize", "enhanced-determinism"] }
web-time = "1.1.0"
safe_index = "0.10.0"
netcode-rs = "1.4.0"
zero_ecs = "0.3.4"
once_cell = "1.21.4"
msgpacker = "0.7.2"
rayon = "1.12.0"
anyhow = "1.0.104"
petgraph = "0.8.3"
clap = { version = "4.6.7", features = ["derive"] }
polyanya = { version = "0.18.0", features = ["detailed-layers"]}
rerecast = { version = "0.5.0" }
monstertruck = { version="0.4.1", features = ["solid"]}
serde_json = {version = "1.0.154"}
serde = {version = "1.0.229" }
binary-greedy-meshing = "0.6.1"
#landmark = { git = "https://www.github.com/ColinGilbert/recast-rs.git", branch = "main" }
#waymark = { git = "https://www.github.com/ColinGilbert/recast-rs.git", branch = "main" }
#waymark-crowd = { git = "https://www.github.com/ColinGilbert/recast-rs.git", branch = "main" }
#waymark-dynamic = { git = "https://www.github.com/ColinGilbert/recast-rs.git", branch = "main" }
#waymark-tilecache = { git = "https://www.github.com/ColinGilbert/recast-rs.git", branch = "main" }